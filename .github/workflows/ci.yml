name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm install --global npm@12
      - run: npm ci --strict-allow-scripts && (cd src/diff_tool/app && npm ci --strict-allow-scripts)
      - run: npm run check
      - run: git diff --exit-code
      - run: npm run build
      - run: npm test
